<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>TubeFox</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <h1 id="title">TubeFox</h1>
  <input id="q" type="search" placeholder="Search videos" autocomplete="off">
</header>
<main id="list"></main>
<nav id="tabs">
  <button data-v="home" class="on">Trending</button>
  <button data-v="subs">Feed</button>
  <button data-v="saved">Saved</button>
  <button data-v="history">History</button>
  <button data-v="settings">Settings</button>
</nav>
<section id="player" hidden>
  <video id="video" controls playsinline></video>
  <div id="pinfo">
    <h2 id="ptitle"></h2>
    <p id="pmeta"></p>
    <div class="row">
      <button id="bSub"></button>
      <button id="bFav"></button>
      <select id="qual"></select>
      <button id="bClose">Close</button>
    </div>
    <p id="pdesc"></p>
    <div id="related"></div>
  </div>
</section>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
